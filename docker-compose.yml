name: fraud-kafka

x-app: &app
  build: .
  image: fraud-kafka-app:local
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    POSTGRES_HOST: postgres
    POSTGRES_DB: fraud
    POSTGRES_USER: fraud
    POSTGRES_PASSWORD: fraud_local
  networks:
    - fraud

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD', '/opt/kafka/bin/kafka-topics.sh', '--bootstrap-server', 'localhost:9092', '--list']
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped
    networks:
      - fraud

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/bash', '-ec']
    command:
      - |
        for topic in transactions scores; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
    networks:
      - fraud

  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fraud -d fraud']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks:
      - fraud

  scorer:
    <<: *app
    command: ['python', '-m', 'app.consumer']
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  db-writer:
    <<: *app
    command: ['python', '-m', 'app.db_writer']
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  interface:
    <<: *app
    command: ['streamlit', 'run', 'app/interface.py', '--server.address=0.0.0.0', '--server.port=8501', '--server.maxUploadSize=200', '--browser.gatherUsageStats=false']
    ports:
      - '127.0.0.1:8501:8501'
    volumes:
      - ./data:/app/data:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8501/_stcore/health", timeout=3)']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  check:
    <<: *app
    profiles: ['tools']
    command: ['python', 'scripts/check.py']
    volumes:
      - ./data:/app/data:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      scorer:
        condition: service_started
      db-writer:
        condition: service_started

  prepare:
    <<: *app
    profiles: ['tools']
    command: ['python', 'scripts/prepare.py']
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models

networks:
  fraud:
    driver: bridge

volumes:
  kafka_data:
  postgres_data:
